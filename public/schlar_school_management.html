    function App() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem('schlar_demo_state');
          return saved ? JSON.parse(saved) : INITIAL_STATE;
        } catch (e) {
          return INITIAL_STATE;
        }
      });

      const [toast, setToast] = useState(null);

      // Save to localStorage
      useEffect(() => {
        try {
          localStorage.setItem('schlar_demo_state', JSON.stringify(state));
        } catch (e) {}
      }, [state]);

      const showToast = (title, message) => {
        setToast({ title, message });
        setTimeout(() => setToast(null), 3500);
      };

      // Theme Colors
      const THEMES = {
        indigo: { id: 'indigo', name: 'Sapphire Indigo', primary: '#4f46e5', light: '#eef2ff' },
        emerald: { id: 'emerald', name: 'Forest Emerald', primary: '#059669', light: '#ecfdf5' },
        ocean: { id: 'ocean', name: 'Ocean Sky', primary: '#0284c7', light: '#f0f9ff' },
        violet: { id: 'violet', name: 'Royal Violet', primary: '#7c3aed', light: '#f5f3ff' },
        crimson: { id: 'crimson', name: 'Crimson Rose', primary: '#e11d48', light: '#fff1f2' },
        amber: { id: 'amber', name: 'Warm Amber', primary: '#d97706', light: '#fffbeb' },
        slate: { id: 'slate', name: 'Midnight Slate', primary: '#334155', light: '#f8fafc' }
      };

      // Role configs - Exactly 6 Web Roles and 2 Mobile Roles
      const ROLES = {
        web: [
          { id: 'principal', title: 'Principal / Admin', name: 'Dr. Robert Hayes', color: 'indigo' },
          { id: 'vice_principal', title: 'Academic Coordinator', name: 'Sarah Jenkins', color: 'purple' },
          { id: 'teacher', title: 'Faculty Teacher', name: 'Marcus Sterling', color: 'emerald' },
          { id: 'accountant', title: 'Finance Accountant', name: 'Edward Fletcher', color: 'amber' },
          { id: 'receptionist', title: 'Front Office', name: 'Clara Oswald', color: 'cyan' },
          { id: 'librarian', title: 'Senior Librarian', name: 'Arthur Pendelton', color: 'teal' }
        ],
        mobile: [
          { id: 'teacher', title: 'Teacher App', name: 'Marcus Sterling', color: 'emerald' },
          { id: 'parent', title: 'Parent Portal', name: 'Vikram Sharma', color: 'blue' }
        ]
      };

      // Role navigations
      const getRoleNav = () => {
        switch (state.currentRole) {
          case 'principal':
            return ['dashboard', 'students', 'teachers', 'classes', 'academics', 'finance', 'profile', 'settings'];
          case 'vice_principal':
            return ['dashboard', 'classes', 'teachers', 'subjects', 'attendance', 'exams', 'reports', 'profile'];
          case 'teacher':
            return ['dashboard', 'my_classes', 'students', 'attendance', 'marks', 'assignments', 'messages', 'profile'];
          case 'accountant':
            return ['dashboard', 'fees', 'fee_structure', 'collections', 'pending_fees', 'receipts', 'profile'];
          case 'receptionist':
            return ['dashboard', 'visitors', 'enquiries', 'students', 'profile'];
          case 'hr':
            return ['dashboard', 'staff', 'departments', 'attendance', 'leave', 'profile'];
          case 'librarian':
            return ['dashboard', 'books', 'issued', 'overdue', 'profile'];
          default:
            return ['dashboard', 'students', 'profile'];
        }
      };

      // Actions
      const addStudent = (std) => {
        const newStd = { id: 'std-' + Date.now(), ...std, attendanceRate: 95.0, academicStatus: 'Good' };
        setState(prev => ({
          ...prev,
          students: [newStd, ...prev.students]
        }));
        showToast('Student Added', `${std.name} registered into Greenfield database.`);
      };

      const recordPayment = (studentId, amount, method) => {
        const student = state.students.find(s => s.id === studentId);
        const receiptNo = 'REC-2026-' + Math.floor(100 + Math.random() * 900);
        setState(prev => ({
          ...prev,
          fees: prev.fees.map(f => f.studentId === studentId ? {
            ...f,
            paidAmount: f.paidAmount + amount,
            pendingAmount: Math.max(0, f.pendingAmount - amount),
            status: (f.pendingAmount - amount <= 0) ? 'Paid' : 'Partially Paid'
          } : f),
          payments: [{
            id: 'pay-' + Date.now(),
            receiptNumber: receiptNo,
            studentId,
            studentName: student ? student.name : 'Student',
            class: student ? student.class : 'Grade 10',
            amount,
            date: new Date().toISOString().split('T')[0],
            paymentMethod: method,
            referenceNumber: 'TXN-' + Math.floor(100000 + Math.random() * 900000)
          }, ...prev.payments]
        }));
        showToast('Payment Recorded', `Voucher ${receiptNo} generated for $${amount}.`);
      };

      const checkInVisitor = (name, purpose, person) => {
        setState(prev => ({
          ...prev,
          visitors: [{
            id: 'vis-' + Date.now(),
            visitorName: name,
            purpose,
            personToMeet: person,
            phone: '+1 555-0199',
            entryTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            date: new Date().toISOString().split('T')[0],
            status: 'Checked In'
          }, ...prev.visitors]
        }));
        showToast('Visitor Checked In', `Pass issued for ${name}.`);
      };

      const checkOutVisitor = (id) => {
        setState(prev => ({
          ...prev,
          visitors: prev.visitors.map(v => v.id === id ? {
            ...v,
            status: 'Checked Out',
            exitTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          } : v)
        }));
        showToast('Visitor Checked Out', 'Visitor exit recorded.');
      };

      const handleLeave = (id, decision) => {
        setState(prev => ({
          ...prev,
          leaveRequests: prev.leaveRequests.map(l => l.id === id ? { ...l, status: decision } : l)
        }));
        showToast('Leave Processed', `Application marked as ${decision}.`);
      };

      const returnLibraryBook = (txId) => {
        const tx = state.libraryTransactions.find(t => t.id === txId);
        setState(prev => ({
          ...prev,
          libraryTransactions: prev.libraryTransactions.map(t => t.id === txId ? { ...t, status: 'Returned' } : t),
          books: prev.books.map(b => b.id === tx?.bookId ? { ...b, availableCopies: b.availableCopies + 1 } : b)
        }));
        showToast('Book Returned', `Restored available copy of ${tx?.bookTitle || 'Book'}.`);
      };

      const resetData = () => {
        if (confirm('Reset Greenfield International School demo data to pristine initial state?')) {
          setState(INITIAL_STATE);
          localStorage.removeItem('schlar_demo_state');
          showToast('Data Reset', 'All demo changes refreshed.');
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Bar Header */}
          <header className="bg-white border-b px-4 py-2.5 flex items-center justify-between sticky top-0 z-30 shadow-xs">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2">
                <span className="w-7 h-7 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-xs">E</span>
                <span className="font-bold text-base tracking-tight text-slate-900">Schlar</span>
              </div>
              <span className="text-slate-300">|</span>
              <span className="text-xs font-semibold text-slate-600 hidden sm:inline">Greenfield International School</span>
            </div>

            {/* Platform & Role Switcher */}
            <div className="flex items-center gap-2">
              {/* Platform Toggle */}
              <div className="bg-slate-100 p-0.5 rounded-lg flex text-xs">
                <button
                  onClick={() => setState(prev => ({ ...prev, currentPlatform: 'web', currentRole: 'principal', activeNav: 'dashboard' }))}
                  className={`px-2.5 py-1 rounded-md font-semibold transition-all ${state.currentPlatform === 'web' ? 'bg-white shadow-xs text-slate-900' : 'text-slate-500'}`}
                >
                  Web
                </button>
                <button
                  onClick={() => setState(prev => ({ ...prev, currentPlatform: 'mobile', currentRole: 'parent', activeNav: 'home' }))}
                  className={`px-2.5 py-1 rounded-md font-semibold transition-all ${state.currentPlatform === 'mobile' ? 'bg-white shadow-xs text-slate-900' : 'text-slate-500'}`}
                >
                  Mobile
                </button>
              </div>

              {/* Role Dropdown */}
              <select
                value={state.currentRole}
                onChange={(e) => setState(prev => ({ ...prev, currentRole: e.target.value, activeNav: 'dashboard' }))}
                className="px-2.5 py-1 bg-white border rounded-lg text-xs font-semibold text-slate-800"
              >
                {ROLES[state.currentPlatform].map(r => (
                  <option key={r.id} value={r.id}>{r.title} ({r.name})</option>
                ))}
              </select>

              {/* Theme Color Selector */}
              <div className="flex items-center gap-1.5 bg-white border rounded-lg px-2 py-1 text-xs shadow-2xs">
                <span
                  className="w-3 h-3 rounded-full shrink-0 border"
                  style={{ backgroundColor: (THEMES[state.themeColor] || THEMES.indigo).primary }}
                />
                <select
                  value={state.themeColor || 'indigo'}
                  onChange={(e) => {
                    const chosen = e.target.value;
                    setState(prev => ({ ...prev, themeColor: chosen }));
                    showToast('Theme Updated', 'Accent color set to ' + (THEMES[chosen]?.name || chosen));
                  }}
                  className="bg-transparent font-semibold text-slate-700 text-xs outline-none cursor-pointer"
                  title="Choose Accent Color"
                >
                  {Object.keys(THEMES).map(k => (
                    <option key={k} value={k}>{THEMES[k].name}</option>
                  ))}
                </select>
              </div>

              {/* User Profile Pill */}
              <button
                onClick={() => setState(prev => ({ ...prev, activeNav: 'profile' }))}
                className="flex items-center gap-1.5 px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-semibold border border-indigo-200 transition-colors"
                title="View My Institutional Profile"
              >
                <span className="w-5 h-5 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px] font-bold">
                  {(ROLES[state.currentPlatform].find(r => r.id === state.currentRole)?.name || 'Admin').split(' ').map(n=>n[0]).join('').slice(0,2)}
                </span>
                <span className="hidden md:inline font-bold">
                  {ROLES[state.currentPlatform].find(r => r.id === state.currentRole)?.name || 'Profile'}
                </span>
                <span className="text-[10px] font-mono text-indigo-600 bg-white px-1.5 py-0.5 rounded shadow-2xs">Profile</span>
              </button>

              {/* Reset Demo Data Button */}
              <button
                onClick={resetData}
                title="Reset Demo Data"
                className="p-1.5 text-slate-400 hover:text-rose-600 rounded-md border text-xs"
              >
                Reset
              </button>
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg border border-slate-700 text-xs">
              <span className="font-bold block">{toast.title}</span>
              <span className="text-slate-300">{toast.message}</span>
